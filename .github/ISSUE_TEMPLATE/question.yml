name: Question
description: Ask a question about using or integrating @octokern/config.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        For general usage discussions, consider [GitHub Discussions](https://github.com/octokern/config/discussions).
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: v24.0.0
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Relevant code or error
      render: typescript
