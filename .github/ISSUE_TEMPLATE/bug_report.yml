name: Bug report
description: Report a reproducible defect in @octokern/config.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include secrets or full environment files.
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: The installed @octokern/config version.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: v24.0.0
    validations:
      required: true
  - type: dropdown
    id: module-format
    attributes:
      label: Module format
      options:
        - ESM
        - CommonJS
        - Both
    validations:
      required: true
  - type: dropdown
    id: nest-version
    attributes:
      label: NestJS version (if applicable)
      options:
        - Not using NestJS
        - 10.x
        - 11.x
        - 12.x
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message, with secrets removed.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Share a minimal code sample or repository. Never paste .env files or credentials.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
