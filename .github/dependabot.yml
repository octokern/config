version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

    groups:
      development-dependencies:
        dependency-type: development

    ignore:
      - dependency-name: typescript
        versions:
          - '>=6.1.0'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - 'actions/*'
          - 'github/*'
          - 'changesets/*'
